<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Badges</title>
        <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@100..900,0&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Yantramanav:wght@100;300;400;500;700;900&display=swap"
              rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/badges.css') }}">
    </head>
    <body>
        {% include "partials/nav.html" %}
        {% from "partials/macros.html" import badge_case %}

        <main class="container">
            <section class="chart-container">
                {% for badge in context %}
                    {{ badge_case(badge.category_name, badge.badges) }}
                {% endfor %}
            </section>
        </main>
        <div class="space"></div>
        {% include "partials/footer.html" %}
    </body>
</html>
